<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceCast · 声演调音台</title>
<link rel="stylesheet" href="/static/style.css?v=20260905">
</head>
<body class="studio">

<!-- 开屏：设备通电 -->
<div id="boot">
  <div class="boot-rack">
    <div class="boot-power"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="boot-name">VOICECAST</div>
    <div class="boot-model">声演调音台 · SOUND CONSOLE MK-II</div>
  </div>
</div>

<!-- 环境光晕 -->
<div class="ambient"></div>

<div class="console">

  <!-- ═══ 顶部设备架（引擎电源 + 音色资产设备）═══ -->
  <header class="rack">
    <div class="rack-left">
      <div class="brand">
        <div class="brand-eq"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="brand-txt">VOICECAST<small>SOUND CONSOLE MK-II</small></div>
      </div>
      <div class="power-leds" id="engineLeds" title="引擎状态"></div>
    </div>
    <div class="rack-units" id="rackUnits"></div>
  </header>

  <!-- ═══ 中央调音台台面 ═══ -->
  <main class="deck">

    <!-- 台面选择（通道分区按钮） -->
    <div class="deck-select">
      <button class="deck-btn active" data-deck="preamp">
        <span class="db-name">话放台</span><span class="db-sub">音色设计</span>
      </button>
      <button class="deck-btn" data-deck="router">
        <span class="db-name">路由台</span><span class="db-sub">音色混合</span>
      </button>
      <button class="deck-btn" data-deck="transport">
        <span class="db-name">走带台</span><span class="db-sub">批量配音</span>
      </button>
      <button class="deck-btn" data-deck="patchbay">
        <span class="db-name">设备架</span><span class="db-sub">音色资产</span>
      </button>
    </div>

    <!-- ── 话放台：音色设计 ── -->
    <section class="deckview active" id="deck-preamp">
      <div class="channel">
        <div class="ch-strip">
          <div class="ch-screw tl"></div><div class="ch-screw tr"></div>
          <div class="ch-label">PREAMPLIFIER</div>
          <div class="vu-meter" id="designVu">
            <div class="vu-leds" id="designVuLeds"></div>
            <div class="vu-mark"><span>+3</span><span>0</span><span>-3</span><span>-10</span></div>
          </div>
          <div class="ch-input">
            <div class="input-label">CHARACTER BRIEF</div>
            <input id="designDesc" class="ch-input-field" type="text"
              placeholder="描述你的角色声音，如：老年女声 / 反派中年男声…" autocomplete="off">
          </div>
          <div class="ch-knob-row">
            <div class="knob-wrap">
              <div class="knob" id="designKnob" title="按下生成"><div class="knob-ind"></div></div>
              <div class="knob-label">SYNTHESIZE</div>
            </div>
            <div class="ch-status" id="designStatus"></div>
          </div>
        </div>

        <!-- 输出监听 -->
        <div class="ch-output">
          <div class="out-head">
            <span class="out-id" id="designProfileId">— NO VOICE —</span>
            <span class="out-meta" id="designMeta"></span>
          </div>
          <canvas id="designWave" class="out-wave" height="110"></canvas>
          <div class="out-params" id="designParams"></div>
          <div class="out-transport">
            <button class="tbtn play" id="designPlay">▶</button>
            <div class="out-time" id="designTime">00:00.0</div>
          </div>
          <audio id="designAudio" style="display:none"></audio>
        </div>
      </div>
    </section>

    <!-- ── 路由台：音色混合 ── -->
    <section class="deckview" id="deck-router">
      <div class="router">
        <div class="r-in a">
          <div class="r-label">SOURCE A · 主参考</div>
          <select id="blendMain" class="r-select"></select>
        </div>
        <div class="r-fader-zone">
          <div class="r-fader-label">BLEND</div>
          <div class="r-merge-lamp" id="blendLamp"></div>
          <button class="tbtn rec" id="blendBtn" title="融合生成">●</button>
        </div>
        <div class="r-in b">
          <div class="r-label">SOURCE B · 辅助参考（可多选）</div>
          <select id="blendAux" class="r-select" multiple size="5"></select>
        </div>
      </div>
      <div class="r-status" id="blendStatus"></div>
      <div class="ch-output compact">
        <div class="out-head">
          <span class="out-id" id="blendProfileId">— MIX BUS —</span>
          <span class="out-meta" id="blendMeta"></span>
        </div>
        <canvas id="blendWave" class="out-wave" height="90"></canvas>
        <div class="out-transport">
          <button class="tbtn play" id="blendPlay">▶</button>
          <div class="out-time" id="blendTime">00:00.0</div>
        </div>
        <audio id="blendAudio" style="display:none"></audio>
      </div>
    </section>

    <!-- ── 走带台：批量配音 ── -->
    <section class="deckview" id="deck-transport">
      <div class="tape">
        <div class="tape-io">
          <div class="io-row"><span class="io-label">SCRIPT</span>
            <input id="batchScript" class="io-input" value="examples/script_demo.txt"></div>
          <div class="io-row"><span class="io-label">CAST</span>
            <input id="batchCast" class="io-input" value="examples/cast_demo.yaml"></div>
          <div class="io-row"><span class="io-label">OUT</span>
            <input id="batchOut" class="io-input" value="outputs/web"></div>
        </div>
        <div class="tape-meter">
          <div class="tape-counter" id="tapeCounter">00:00:00</div>
          <div class="tape-progress"><div class="tape-progress-bar" id="tapeProgressBar"></div></div>
          <div class="tape-count" id="tapeCount">0/0</div>
        </div>
        <div class="tape-transport">
          <label class="tbtn-toggle"><input type="checkbox" id="batchDry">DRY</label>
          <button class="tbtn rec big" id="batchBtn" title="开始批量配音">●</button>
          <button class="tbtn ghost" id="batchExportBtn" title="导出剪映包（SRT 字幕）">⏏</button>
        </div>
      </div>
      <div class="tape-log-wrap hidden" id="tapeLogWrap">
        <div class="tape-log-head">RUNNING LOG <span id="logCount"></span></div>
        <div class="tape-log" id="tapeLog"></div>
        <div class="tape-result" id="exportResult"></div>
      </div>
    </section>

    <!-- ── 设备架：音色资产 ── -->
    <section class="deckview" id="deck-patchbay">
      <div class="patch-head">
        <div class="patch-filters" id="patchFilters">
          <button class="chip active" data-f="all">ALL UNITS</button>
          <button class="chip" data-f="真人">HUMAN REF</button>
          <button class="chip" data-f="融合">BLEND</button>
          <button class="chip" data-f="edge">EDGE BASE</button>
        </div>
        <input id="assetsSearch" class="patch-search" placeholder="搜索音色… id/名称/标签">
      </div>
      <div class="patch-grid" id="patchGrid"></div>
    </section>

  </main>

  <!-- ═══ 底部状态条 ═══ -->
  <footer class="statusbar">
    <div class="sb-left" id="sbMsg">SYSTEM READY</div>
    <div class="sb-right">
      <span class="sb-clock" id="sbClock"></span>
    </div>
  </footer>
</div>

<script src="/static/app.js?v=20260905"></script>
</body>
</html>
