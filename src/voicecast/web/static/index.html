<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceCast · 声演工作室</title>
<link rel="stylesheet" href="/static/style.css?v=20260908">
</head>
<body>

<!-- 全屏声波粒子场 -->
<canvas id="wavefield"></canvas>
<div class="vignette"></div>

<!-- 鼠标 Spotlight -->
<div class="spotlight" id="spotlight"></div>

<!-- ═══ 开屏仪式 ═══ -->
<div id="boot">
  <div class="boot-word" id="bootWord">VOICECAST</div>
  <div class="boot-line" id="bootLine"></div>
  <div class="boot-sub">SOUND · STUDIO</div>
</div>

<!-- ═══ 主界面 ═══ -->
<div class="app" id="app">

  <!-- 顶栏：品牌 + 引擎灯 -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">VOICECAST</span>
    </div>
    <div class="engine-lights" id="engineLights" title="引擎状态"></div>
  </header>

  <!-- 左侧主导航 -->
  <nav class="rail" id="rail">
    <button class="rail-item active" data-view="design"><span class="ri-idx">01</span><span class="ri-name">音色设计</span></button>
    <button class="rail-item" data-view="blend"><span class="ri-idx">02</span><span class="ri-name">音色混合</span></button>
    <button class="rail-item" data-view="batch"><span class="ri-idx">03</span><span class="ri-name">批量配音</span></button>
    <button class="rail-item" data-view="assets"><span class="ri-idx">04</span><span class="ri-name">音色资产</span></button>
  </nav>

  <!-- 主舞台 -->
  <main class="stage">

    <!-- 01 音色设计 -->
    <section class="scene active" id="scene-design">
      <div class="scene-head reveal">
        <h1 class="big-title" data-split>给角色造一个声音</h1>
        <p class="scene-sub">描述你想要的声音 —— 直接生成，波形即答案。</p>
      </div>
      <div class="design-console reveal">
        <div class="desc-row">
          <input id="designDesc" class="big-input" type="text"
            placeholder="老年女声 / 反派中年男声，低沉阴险…" autocomplete="off" spellcheck="false">
          <button class="btn-primary" id="designBtn">生成音色</button>
        </div>
        <div class="status-line" id="designStatus"></div>
      </div>
      <div class="result-panel hidden" id="designResult">
        <div class="rp-head">
          <span class="rp-id" id="designProfileId">—</span>
          <span class="rp-meta" id="designMeta"></span>
        </div>
        <canvas id="designWave" class="wave-canvas"></canvas>
        <div class="rp-foot">
          <span class="rp-params" id="designParams"></span>
          <button class="play-circle" id="designPlay">▶</button>
          <span class="timecode" id="designTime">00:00.0</span>
        </div>
        <audio id="designAudio" style="display:none"></audio>
      </div>
    </section>

    <!-- 02 音色混合 -->
    <section class="scene" id="scene-blend">
      <div class="scene-head reveal">
        <h1 class="big-title" data-split>融合出独特的声音</h1>
        <p class="scene-sub">主参考 × 辅助参考 —— 多说话人融合，造两个源都没有的新声线。</p>
      </div>
      <div class="blend-console reveal">
        <div class="blend-grid">
          <div class="blend-src">
            <label class="src-label">SOURCE A · 主参考</label>
            <select id="blendMain" class="big-select"></select>
          </div>
          <div class="blend-core">
            <div class="merge-mark">×</div>
            <button class="btn-primary" id="blendBtn">融合</button>
          </div>
          <div class="blend-src">
            <label class="src-label">SOURCE B · 辅助参考（可多选）</label>
            <select id="blendAux" class="big-select" multiple></select>
          </div>
        </div>
        <div class="status-line" id="blendStatus"></div>
      </div>
      <div class="result-panel hidden" id="blendResult">
        <div class="rp-head">
          <span class="rp-id" id="blendProfileId">—</span>
          <span class="rp-meta" id="blendMeta"></span>
        </div>
        <canvas id="blendWave" class="wave-canvas"></canvas>
        <div class="rp-foot">
          <button class="play-circle" id="blendPlay">▶</button>
          <span class="timecode" id="blendTime">00:00.0</span>
        </div>
        <audio id="blendAudio" style="display:none"></audio>
      </div>
    </section>

    <!-- 03 批量配音 -->
    <section class="scene" id="scene-batch">
      <div class="scene-head reveal">
        <h1 class="big-title" data-split>剧本 · 一键批量成声</h1>
        <p class="scene-sub">分角色批量生成 · 逐句实时进度 · 单句可重生成 · 导出剪映包。</p>
      </div>
      <div class="batch-console reveal">
        <div class="batch-paths">
          <div class="bp"><label>SCRIPT</label><input id="batchScript" class="mini-input" value="examples/script_demo.txt"></div>
          <div class="bp"><label>CAST</label><input id="batchCast" class="mini-input" value="examples/cast_demo.yaml"></div>
          <div class="bp"><label>OUT</label><input id="batchOut" class="mini-input" value="outputs/web"></div>
        </div>
        <div class="batch-actions">
          <label class="check"><input type="checkbox" id="batchDry"> 仅规划</label>
          <button class="btn-primary" id="batchBtn">开始配音</button>
          <button class="btn-ghost" id="batchExportBtn">导出剪映包</button>
        </div>
      </div>
      <div class="batch-monitor hidden" id="batchMonitor">
        <div class="bm-head">
          <span class="bm-count" id="tapeCount">0/0</span>
          <div class="bm-progress"><div class="bm-bar" id="bmBar"></div></div>
        </div>
        <div class="bm-log" id="bmLog"></div>
      </div>
    </section>

    <!-- 04 音色资产 -->
    <section class="scene" id="scene-assets">
      <div class="scene-head reveal">
        <h1 class="big-title" data-split>你的音色资产库</h1>
        <p class="scene-sub">真人参考 / 融合 / 基础 —— 全部可用音色，随时用于角色。</p>
      </div>
      <div class="assets-toolbar reveal">
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-f="all">全部</button>
          <button class="chip" data-f="真人">真人参考</button>
          <button class="chip" data-f="融合">融合</button>
          <button class="chip" data-f="edge">edge 基础</button>
        </div>
        <input id="assetsSearch" class="mini-input search" placeholder="搜索音色…" spellcheck="false">
      </div>
      <div class="asset-grid" id="assetGrid"></div>
    </section>

  </main>

  <!-- 底部状态 -->
  <footer class="statusbar">
    <span id="sbMsg">SYSTEM READY</span>
    <span class="clock" id="clock"></span>
  </footer>
</div>

<script src="/static/app.js?v=20260908"></script>
</body>
</html>
