[project]
name = "voicecast"
version = "0.1.0"
description = "以角色为中心的 AI 配音工作台：凭空设计角色音色，一键批量配音，本地优先、零供应商依赖"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "gradio>=4.44",
    "edge-tts>=6.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
voicecast = "voicecast.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
